<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1460" viewBox="0 0 1000 1460" role="img" aria-labelledby="title desc">
  <title id="title">Arieff — Full Coffee Brown Editorial Portfolio</title>
  <desc id="desc">A warm coffee-brown portfolio with about, current focus, technology stack, selected repositories, and GitHub statistics sections.</desc>
  <defs>
