  <text x="92" y="531" class="body"><tspan x="92" dy="0">Hi, I'm Arieff — an Informatics</tspan><tspan x="92" dy="25">Engineering student interested in</tspan><tspan x="92" dy="25">software development and useful</tspan><tspan x="92" dy="25">digital products. I learn by making</tspan><tspan x="92" dy="25">projects and improving every day.</tspan></text>
