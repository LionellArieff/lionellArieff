      .sans{font-family:Arial,Helvetica,sans-serif}
      .cream{fill:#F5EFE6}.ink{fill:#493727}.muted{fill:#80644D}.line{stroke:#B99A7B;stroke-width:1}
      .section{font:600 18px Arial,Helvetica,sans-serif;letter-spacing:1.4px;fill:#493727}
      .body{font:16px Arial,Helvetica,sans-serif;fill:#493727}
      .small{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.8px}
